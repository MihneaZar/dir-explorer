How do I move in the current directory?:
    - "    - arrow keys -> moving between files in the current directory."
    - "    - character  -> move cursor to the next directory / file that starts with character, if it exists."
    - "    - ctrl+f     -> search for the next directory / file that contains string, if it exists (not case sensitive);"
    - "                 -> while typing the search string, tab will autocomplete the highlighted match;"
    - "                 -> also, up/down arrows will cycle through all filenames that match the typed string."
    - "    - '\\'        -> find next directory / file that contains last searched string."
    - "    - enter      -> open directory (highlighted yellow) in current dir-explorer."
    - "    - backspace  -> return to parent directory of current directory."
Opening files and directories:
    - "    - enter  -> open file or directory:"
    - "                - open directory (highlighted yellow) in current dir-explorer;"
    - "                - run .exe, .py, .bat and .sh files (highighted blue);"
    - "                - open any other file type in the default application."
    - "    - ctrl+s -> open menu to switch running type for runnable files."
    - "    - ctrl+o -> open images in paint, python files in VS code, all other files in notepad."
    - "    - tab    -> open current directory in file explorer."
    - "    - '`'    -> open current directory in powershell."
    - "    - '~'    -> open current directory in another dir-explorer."
Edit files and directories:
    - "    - ctrl+n -> create new file or directory:"
    - "                - file w/  extension: '{filename}.{extension}';"
    - "                - file w/o extension: '{filename}.';"
    - "                - directory:          '{filename}'."
    - "    - ctrl+r -> rename selected directory / file (to remove file extension, type '{filename}.')."
    - "    - ctrl+c -> set or unset file to be copied."
    - "    - ctrl+x -> set or unset directory / file to be moved."
    - "    - insert -> copy and move all directories and files to current directory."
    - "    - ctrl+z -> clear all directories and files set to be copied and moved."
    - "    - delete -> move directory / file to recycle bin."
    - "    - ctrl+b -> open recycle bin in Windows File Explorer."
    - ""
    - "!! Important note: copying or deleting large directories / files (>1GB) may take a substantial amount of time."
    - "It is preferable to copy and delete such files by opening the current directory with Tab and using the OS GUI."
File and directory paths:
    - "    - ctrl+t -> print the tree of the current directory."
    - "    - ctrl+p -> print the path of selected the file or directory and copy it."
    - "    - ctrl+d -> print the path of the current directory and copy it."
Application options:
    - "    - ctrl+u  -> update list (if directory was changed outside this app or terminal window was resized)."
    - "    - '='/'-' -> increase/decrease number of characters in file and directory names before they are cut off."
    - "    - '?'     -> display current help page."
    - "    - escape  -> quit application."